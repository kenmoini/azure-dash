apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-dash
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azure-dash
                port:
                  name: http
